<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0A">
<title>لوحة التحكم | بيت الباشا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root {
  --bg: #0A0A0A; --bg-2: #141414; --bg-3: #1A1A1A;
  --card: #1A1A1A; --primary: #D4AF37; --primary-2: #E5C158;
  --text: #F5F5F5; --dim: #A0A0A0; --border: rgba(212, 175, 55, 0.2);
  --danger: #E10600; --success: #25D366;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}

.svg-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top, #1A1A1A 0%, #0A0A0A 100%)}
.login-card{background:var(--card);border-radius:20px;padding:40px 30px;max-width:400px;width:100%;border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,0.5);text-align:center}
.login-logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg, var(--primary), var(--primary-2));display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--bg)}
.login-title{font-family:'Amiri',serif;font-size:26px;color:var(--primary);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--dim);margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:right}
.form-label{display:block;font-size:13px;font-weight:700;color:var(--primary);margin-bottom:6px}
.form-input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);font-size:14px;outline:none;transition:all 0.3s}
.form-input:focus{border-color:var(--primary);background:var(--bg-3)}
.form-input:disabled{opacity:0.6;cursor:not-allowed}
.btn{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s;background:var(--primary);color:var(--bg)}
.btn:hover{background:var(--primary-2)}
.btn:disabled{opacity:0.5;pointer-events:none}
.err-msg{background:rgba(225,6,0,0.1);color:var(--danger);padding:10px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;text-align:center;border:1px solid rgba(225,6,0,0.3)}
.err-msg.show{display:block}

/* App Layout */
.app-wrap{display:none;min-height:100vh;flex-direction:column}
.app-wrap.show{display:flex}
.header{background:var(--bg-2);padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--bg);display:flex;align-items:center;justify-content:center}
.header-title{font-family:'Amiri',serif;font-size:20px;color:var(--primary)}
.header-actions{display:flex;gap:8px}
.btn-sm{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--border);color:var(--text);text-decoration:none;transition:all 0.3s}
.btn-sm:hover{background:var(--border)}
.btn-sm.logout{background:rgba(225,6,0,0.1);color:var(--danger);border-color:rgba(225,6,0,0.3)}

.tabs{background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 20px}
.tab-btn{padding:16px 24px;font-size:14px;font-weight:700;color:var(--dim);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:all 0.3s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}

.main-content{flex:1;padding:24px 20px;max-width:1200px;margin:0 auto;width:100%}
.panel{display:none;animation:fadeIn 0.3s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.card-box{background:var(--card);border-radius:16px;padding:24px;border:1px solid var(--border);margin-bottom:24px}
.card-title{font-family:'Amiri',serif;font-size:20px;color:var(--primary);margin-bottom:20px;display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px dashed var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.form-row{grid-template-columns:1fr}}

/* Item List */
.list-wrap{display:flex;flex-direction:column;gap:12px}
.item-card{display:flex;align-items:center;gap:16px;background:var(--bg-2);padding:12px;border-radius:12px;border:1px solid var(--border)}
.item-img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--bg-3)}
.item-info{flex:1}
.item-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.item-cat{font-size:12px;color:var(--primary);background:rgba(212,175,55,0.1);padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px}
.item-price{font-size:14px;color:var(--primary);font-weight:700}
.item-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.3s;background:var(--bg-3);border:1px solid var(--border);color:var(--text)}
.icon-btn:hover{background:var(--border)}
.icon-btn.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

/* Upload */
.upload-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.upload-preview{width:100px;height:100px;border-radius:12px;border:2px dashed var(--border);background:var(--bg-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.upload-preview img{width:100%;height:100%;object-fit:cover;display:none}
.upload-input-wrap{position:relative;flex:1}
.upload-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-btn{width:100%;padding:14px;border-radius:10px;border:1px dashed var(--border);background:var(--bg-2);color:var(--primary);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.progress-bar-wrap{width:100%;height:6px;background:var(--bg-3);border-radius:3px;margin-top:8px;display:none}
.progress-bar{height:100%;width:0%;background:var(--primary);border-radius:3px;transition:width 0.3s}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);padding:12px 24px;border-radius:30px;font-size:14px;font-weight:700;color:var(--text);border:1px solid var(--primary);box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:9999;transition:all 0.4s;opacity:0;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.success{border-color:var(--success);color:var(--success)}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg class="svg-icon" style="width:40px;height:40px" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <h1 class="login-title">لوحة تحكم بيت الباشا</h1>
    <p class="login-sub">قم بتسجيل الدخول للمتابعة</p>
    
    <div class="err-msg" id="loginError"></div>
    
    <div class="form-group">
      <label class="form-label">البريد الإلكتروني</label>
      <input type="email" class="form-input" id="loginEmail" value="admin@beitalbasha.com" disabled>
    </div>
    <div class="form-group">
      <label class="form-label">كلمة المرور</label>
      <input type="password" class="form-input" id="loginPassword" placeholder="أدخل كلمة المرور">
    </div>
    <button class="btn" id="loginBtn">دخول</button>
  </div>
</div>

<!-- App Screen -->
<div class="app-wrap" id="appScreen">
  <header class="header">
    <div class="header-brand">
      <div class="header-logo"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <div class="header-title">بيت الباشا</div>
    </div>
    <div class="header-actions">
      <a href="index.html" target="_blank" class="btn-sm">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        عرض المنيو
      </a>
      <button class="btn-sm logout" id="logoutBtn">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        خروج
      </button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="items">
      <svg class="svg-icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      إدارة الأصناف
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      الإعدادات
    </button>
  </nav>

  <main class="main-content">
    <!-- Items Panel -->
    <div class="panel active" id="panel-items">
      <div class="card-box">
        <h2 class="card-title" id="formTitle">إضافة صنف جديد</h2>
        <input type="hidden" id="editItemId">
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">اسم الصنف</label>
            <input type="text" class="form-input" id="itemName" placeholder="مثال: قهوة تركية">
          </div>
          <div class="form-group">
            <label class="form-label">القسم</label>
            <input type="text" class="form-input" id="itemCategory" placeholder="مثال: مشروبات ساخنة">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">السعر</label>
            <input type="number" class="form-input" id="itemPrice" placeholder="10000">
          </div>
          <div class="form-group">
            <label class="form-label">الوصف (اختياري)</label>
            <input type="text" class="form-input" id="itemDesc" placeholder="وصف قصير...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">صورة الصنف</label>
          <div class="upload-box">
            <div class="upload-preview" id="imgPreview">
              <svg class="svg-icon" style="color:var(--dim);width:30px;height:30px" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <img id="imgPreviewTag" src="" alt="">
            </div>
            <div class="upload-input-wrap">
              <input type="file" class="upload-input" id="itemImage" accept="image/*">
              <div class="upload-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                اختر صورة
              </div>
              <div class="progress-bar-wrap" id="uploadProgress"><div class="progress-bar" id="progressBar"></div></div>
              <input type="hidden" id="itemImageUrl">
            </div>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:20px">
          <button class="btn" id="saveItemBtn" style="flex:1">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            حفظ
          </button>
          <button class="btn" id="cancelEditBtn" style="background:var(--bg-3);color:var(--text);display:none;flex:0.5">إلغاء</button>
        </div>
      </div>

      <div class="card-box">
        <h2 class="card-title">الأصناف الحالية</h2>
        <div class="list-wrap" id="itemsList">
          <div style="text-align:center;color:var(--dim);padding:20px">جاري تحميل الأصناف...</div>
        </div>
      </div>
    </div>

    <!-- Settings Panel -->
    <div class="panel" id="panel-settings">
      <div class="card-box">
        <h2 class="card-title">إعدادات المطعم</h2>
        <div class="form-group">
          <label class="form-label">اسم المطعم/الكافيه</label>
          <input type="text" class="form-input" id="setName" placeholder="بيت الباشا">
        </div>
        <div class="form-group">
          <label class="form-label">العنوان أو الوصف الفرعي</label>
          <input type="text" class="form-input" id="setSubtitle" placeholder="حماة - شارع ...">
        </div>
        <div class="form-group">
          <label class="form-label">حالة المطعم</label>
          <input type="text" class="form-input" id="setStatus" placeholder="مفتوح الآن">
        </div>
        <button class="btn" id="saveSettingsBtn" style="margin-top:20px">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          حفظ الإعدادات
        </button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ⚠️ ضع كود Firebase الخاص بمشروع بيت الباشا هنا
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ⚠️ ضع إعدادات Cloudinary هنا
  const CLOUD_NAME = "YOUR_CLOUD_NAME";
  const UPLOAD_PRESET = "beitalbasha"; // تأكد أنه Unsigned
  
  const ADMIN_EMAIL = "admin@beitalbasha.com";
  
  let allItems = [];
  let editingId = null;
  let currentImageUrl = "";

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('en-US');

  function showToast(msg, type = "") {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show " + type;
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.className = "toast " + type, 3000);
  }

  /* Login Logic */
  $("loginBtn").onclick = async () => {
    const pass = $("loginPassword").value;
    if (!pass) return showToast("الرجاء إدخال كلمة المرور", "error");
    
    $("loginBtn").disabled = true;
    $("loginBtn").textContent = "جاري التحقق...";
    $("loginError").classList.remove("show");

    try {
      await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass);
    } catch (err) {
      console.error(err);
      $("loginError").textContent = "كلمة المرور غير صحيحة";
      $("loginError").classList.add("show");
      $("loginBtn").disabled = false;
      $("loginBtn").textContent = "دخول";
    }
  };

  $("loginPassword").addEventListener("keypress", e => {
    if (e.key === "Enter") $("loginBtn").click();
  });

  $("logoutBtn").onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    if (user && user.email === ADMIN_EMAIL) {
      $("loginScreen").style.display = "none";
      $("appScreen").classList.add("show");
      $("loginPassword").value = "";
      $("loginBtn").disabled = false;
      $("loginBtn").textContent = "دخول";
      startListeners();
    } else {
      $("loginScreen").style.display = "flex";
      $("appScreen").classList.remove("show");
      $("loginBtn").disabled = false;
      $("loginBtn").textContent = "دخول";
    }
  });

  /* Tabs */
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      $("panel-" + btn.dataset.tab).classList.add("active");
    };
  });

  /* Listeners */
  function startListeners() {
    // Fetch Items
    onSnapshot(doc(db, "menu", "all"), snap => {
      if (snap.exists()) {
        const data = snap.data();
        allItems = data.items || [];
      } else {
        allItems = [];
      }
      renderItems();
    });

    // Fetch Settings
    onSnapshot(doc(db, "settings", "info"), snap => {
      if (snap.exists()) {
        const s = snap.data();
        $("setName").value = s.name || "بيت الباشا";
        $("setSubtitle").value = s.subtitle || "";
        $("setStatus").value = s.status || "مفتوح الآن";
      }
    });
  }

  /* Render Items */
  function renderItems() {
    const list = $("itemsList");
    if (allItems.length === 0) {
      list.innerHTML = `<div style="text-align:center;color:var(--dim);padding:20px">لا توجد أصناف حالياً</div>`;
      return;
    }

    list.innerHTML = allItems.map(item => `
      <div class="item-card">
        <img src="${item.imageUrl || 'https://placehold.co/100x100/141414/D4AF37?text=IMG'}" class="item-img" onerror="this.src='https://placehold.co/100x100/141414/D4AF37?text=IMG'">
        <div class="item-info">
          <div class="item-name">
            ${item.name} 
            <span class="item-cat">${item.category}</span>
          </div>
          <div class="item-price">${fmt(item.price)} ل.س</div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" onclick="editItem('${item.id}')">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn del" onclick="deleteItem('${item.id}')">
            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
      </div>
    `).join("");
  }

  /* Image Upload */
  $("itemImage").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;

    $("uploadProgress").style.display = "block";
    $("progressBar").style.width = "30%";

    try {
      const blob = await compressImage(file);
      $("progressBar").style.width = "60%";

      const formData = new FormData();
      formData.append("file", blob);
      formData.append("upload_preset", UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      });
      
      const data = await res.json();
      if (data.secure_url) {
        currentImageUrl = data.secure_url;
        $("itemImageUrl").value = currentImageUrl;
        $("imgPreviewTag").src = currentImageUrl;
        $("imgPreviewTag").style.display = "block";
        $("progressBar").style.width = "100%";
        setTimeout(() => { $("uploadProgress").style.display = "none"; $("progressBar").style.width = "0%"; }, 800);
        showToast("تم رفع الصورة بنجاح", "success");
      }
    } catch (err) {
      console.error(err);
      showToast("فشل رفع الصورة", "error");
      $("uploadProgress").style.display = "none";
    }
  });

  function compressImage(file, maxSize = 800, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
          } else {
            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(resolve, "image/jpeg", quality);
        };
      };
      reader.onerror = error => reject(error);
    });
  }

  /* Save Item */
  $("saveItemBtn").onclick = async () => {
    const name = $("itemName").value.trim();
    const cat = $("itemCategory").value.trim();
    const price = $("itemPrice").value;
    const desc = $("itemDesc").value.trim();
    const imgUrl = $("itemImageUrl").value;

    if (!name || !cat || !price) return showToast("يرجى تعبئة الحقول الأساسية", "error");

    $("saveItemBtn").disabled = true;
    $("saveItemBtn").textContent = "جاري الحفظ...";

    try {
      let updatedItems;
      if (editingId) {
        updatedItems = allItems.map(i => i.id === editingId ? { ...i, name, category: cat, price: Number(price), description: desc, imageUrl: imgUrl } : i);
      } else {
        const newItem = {
          id: Date.now().toString(),
          name,
          category: cat,
          price: Number(price),
          description: desc,
          imageUrl: imgUrl,
          createdAt: Date.now()
        };
        updatedItems = [...allItems, newItem];
      }

      await setDoc(doc(db, "menu", "all"), { items: updatedItems });
      showToast(editingId ? "تم التعديل بنجاح" : "تمت الإضافة بنجاح", "success");
      resetForm();
    } catch (err) {
      showToast("فشل الحفظ", "error");
    } finally {
      $("saveItemBtn").disabled = false;
      $("saveItemBtn").innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ`;
    }
  };

  $("cancelEditBtn").onclick = resetForm;

  window.editItem = (id) => {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    editingId = id;
    $("editItemId").value = id;
    $("itemName").value = item.name;
    $("itemCategory").value = item.category;
    $("itemPrice").value = item.price;
    $("itemDesc").value = item.description || "";
    $("itemImageUrl").value = item.imageUrl || "";
    
    if (item.imageUrl) {
      $("imgPreviewTag").src = item.imageUrl;
      $("imgPreviewTag").style.display = "block";
    } else {
      $("imgPreviewTag").style.display = "none";
    }

    $("formTitle").textContent = "تعديل صنف";
    $("saveItemBtn").textContent = "حفظ التعديلات";
    $("cancelEditBtn").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  window.deleteItem = async (id) => {
    if (!confirm("هل أنت متأكد من حذف هذا الصنف؟")) return;
    try {
      const updatedItems = allItems.filter(i => i.id !== id);
      await setDoc(doc(db, "menu", "all"), { items: updatedItems });
      showToast("تم الحذف بنجاح", "success");
    } catch (err) {
      showToast("فشل الحذف", "error");
    }
  };

  function resetForm() {
    editingId = null;
    $("itemName").value = "";
    $("itemCategory").value = "";
    $("itemPrice").value = "";
    $("itemDesc").value = "";
    $("itemImageUrl").value = "";
    $("itemImage").value = "";
    $("imgPreviewTag").src = "";
    $("imgPreviewTag").style.display = "none";
    $("formTitle").textContent = "إضافة صنف جديد";
    $("saveItemBtn").innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ`;
    $("cancelEditBtn").style.display = "none";
  }

  /* Save Settings */
  $("saveSettingsBtn").onclick = async () => {
    const name = $("setName").value.trim();
    const subtitle = $("setSubtitle").value.trim();
    const status = $("setStatus").value.trim();

    try {
      await setDoc(doc(db, "settings", "info"), { name, subtitle, status }, { merge: true });
      showToast("تم حفظ الإعدادات", "success");
    } catch (err) {
      showToast("فشل حفظ الإعدادات", "error");
    }
  };

</script>
</body>
</html>
