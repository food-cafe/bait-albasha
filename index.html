<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="royal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0a0a0a">
<title>بيت الباشا | قائمة الطعام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<style>
/* ============ THEMES ============ */
:root, [data-theme="royal"] {
  --bg-main: #0a0a0a; --card-bg: #141414; --gold: #D4AF37; --gold-light: #F3E5AB;
  --text-main: #FDFBF7; --text-muted: #888; --border: rgba(212, 175, 55, 0.15);
  --bg-3: #1A1A1A; --nav-bg: rgba(10, 10, 10, 0.88);
}
[data-theme="white-gold"] {
  --bg-main: #F8F9FA; --card-bg: #FFFFFF; --gold: #C9A227; --gold-light: #D4AF37;
  --text-main: #1A1A1A; --text-muted: #555; --border: rgba(201, 162, 39, 0.2);
  --bg-3: #F1F3F5; --nav-bg: rgba(255, 255, 255, 0.88);
}
[data-theme="dark-red"] {
  --bg-main: #0a0a0a; --card-bg: #141414; --gold: #E10600; --gold-light: #FF4D4D;
  --text-main: #F5F5F5; --text-muted: #A0A0A0; --border: rgba(225, 6, 0, 0.15);
  --bg-3: #1A1A1A; --nav-bg: rgba(10, 10, 10, 0.88);
}

/* ============ BASE ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Tajawal', sans-serif; background-color: var(--bg-main); color: var(--text-main);
  line-height: 1.6; background-image: radial-gradient(circle at top, rgba(255,255,255,0.03) 0%, transparent 70%);
  background-attachment: fixed; padding-bottom: 60px; -webkit-font-smoothing: antialiased;
  transition: background 0.4s, color 0.4s; min-height: 100vh;
}

/* Material Symbols base */
.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1;
  letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap;
  word-wrap: normal; direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 48;
  user-select: none;
}

/* ============ HERO ============ */
.hero {
  padding: 55px 20px 45px; text-align: center;
  border-bottom: 1px solid var(--border); position: relative;
  overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -50%; left: 50%;
  transform: translateX(-50%);
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.hero > * { position: relative; z-index: 1; }
.hero.hidden { display: none; }
.hero-logo {
  width: 90px; height: 90px; border-radius: 50%; border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; color: var(--gold);
  margin: 0 auto 18px; background: var(--card-bg);
  box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.06), 0 0 60px rgba(212, 175, 55, 0.2);
  overflow: hidden;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.hero-logo:hover {
  transform: scale(1.05);
  box-shadow: 0 0 0 8px rgba(212, 175, 55, 0.1), 0 0 80px rgba(212, 175, 55, 0.3);
}
.hero-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
.hero h1 {
  font-family: 'Amiri', serif; font-size: 2.6em; font-weight: 700;
  color: var(--gold); margin-bottom: 6px; letter-spacing: 0.5px;
}
.hero h2 {
  font-size: 0.82em; font-weight: 400; letter-spacing: 10px;
  color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase;
}
.hero p {
  font-size: 1.05em; color: var(--text-main);
  max-width: 420px; margin: 0 auto; opacity: 0.75; font-weight: 300;
}

/* ============ STATUS BADGE ============ */
.status-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 18px;
  background: rgba(37, 211, 102, 0.1);
  border: 1px solid rgba(37, 211, 102, 0.3);
  border-radius: 22px;
  font-size: 13px; font-weight: 700; color: #25D366;
  margin-top: 18px;
}
.status-badge[hidden] { display: none; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #25D366;
  animation: pulse 2s infinite; flex-shrink: 0;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
  50% { box-shadow: 0 0 0 8px rgba(37, 211, 102, 0); }
}

/* ============ NAV ============ */
.nav-wrapper {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); padding: 14px 0;
}
.nav-categories {
  display: flex; gap: 10px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity; padding: 0 18px;
  max-width: 1200px; margin: 0 auto;
}
.nav-categories::-webkit-scrollbar { display: none; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 90px; padding: 10px 8px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--border);
  text-decoration: none; color: var(--text-muted);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 3px 12px rgba(0,0,0,0.25); scroll-snap-align: start; flex-shrink: 0;
}
.nav-item .material-symbols-rounded {
  font-size: 26px; color: var(--gold); margin-bottom: 6px;
  transition: transform 0.35s ease;
}
.nav-item span.nav-label { font-size: 0.75em; font-weight: 700; white-space: nowrap; }
.nav-item:hover, .nav-item.active {
  color: var(--gold); border-color: var(--gold);
  box-shadow: 0 8px 22px rgba(212, 175, 55, 0.15);
  transform: translateY(-3px);
}
.nav-item:hover .material-symbols-rounded, .nav-item.active .material-symbols-rounded {
  transform: scale(1.15);
}

/* ============ MENU CONTAINER ============ */
.menu-container { max-width: 1100px; margin: 0 auto; padding: 40px 18px; }
.category-section { margin-bottom: 65px; scroll-margin-top: 130px; }

/* ============ CATEGORY HEADER ============ */
.category-header {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  margin-bottom: 35px; padding: 10px 10px 25px;
  animation: fadeInUp 0.5s ease both;
}
.category-icon-big {
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.12), var(--card-bg) 75%);
  border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px; position: relative;
  box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.05), 0 12px 40px rgba(212, 175, 55, 0.2);
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.category-icon-big::before {
  content: ''; position: absolute; inset: -10px; border-radius: 50%;
  border: 1px dashed var(--gold); opacity: 0.25;
  animation: rotateSlow 40s linear infinite;
}
.category-icon-big .material-symbols-rounded {
  font-size: 44px; color: var(--gold);
  transition: transform 0.4s ease;
}
.category-header:hover .category-icon-big {
  transform: scale(1.05);
  box-shadow: 0 0 0 8px rgba(212, 175, 55, 0.08), 0 16px 50px rgba(212, 175, 55, 0.28);
}
.category-header:hover .category-icon-big .material-symbols-rounded {
  transform: scale(1.08) rotate(-4deg);
}
.category-title {
  font-family: 'Amiri', serif; font-size: 2em; font-weight: 700;
  color: var(--gold); margin: 0; line-height: 1.3; letter-spacing: 0.5px;
}
.category-line {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-top: 12px;
}
.category-line::before, .category-line::after {
  content: ''; height: 1px; width: 60px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.category-line .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
}

/* ============ LAYOUTS ============ */
.menu-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
@media (min-width: 640px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
@media (min-width: 1024px) { .menu-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

.menu-list { display: flex; flex-direction: column; gap: 10px; }

.menu-sections {
  display: grid; grid-template-columns: 1fr; gap: 20px;
}
@media (min-width: 768px) { .menu-sections { grid-template-columns: repeat(2, 1fr); gap: 24px; } }

/* ============ CARDS (Grid & Sections) ============ */
.item-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  box-shadow: 0 8px 22px rgba(0,0,0,0.4);
  animation: fadeInUp 0.4s ease both;
}
.item-card:active { transform: scale(0.98); }
@media (hover: hover) {
  .item-card:hover {
    transform: translateY(-5px); border-color: var(--gold);
    box-shadow: 0 15px 35px rgba(212,175,55,0.15);
  }
  .item-card:hover .item-img { transform: scale(1.06); }
}
.item-img-wrap {
  position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden;
  background: linear-gradient(135deg, var(--bg-3), var(--card-bg));
}
.img-fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--gold); opacity: 0.18; z-index: 1; pointer-events: none;
}
.img-fallback .material-symbols-rounded { font-size: 56px; }
.item-img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  z-index: 2; opacity: 0; transition: opacity 0.5s ease, transform 0.6s ease;
}
.item-img.loaded { opacity: 1; }
.item-content {
  padding: 14px; text-align: center;
  display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1;
}
.item-name {
  font-size: 1em; font-weight: 700; color: var(--text-main);
  margin-bottom: 12px; line-height: 1.35;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.item-price {
  font-size: 1.05em; font-weight: 900; color: var(--gold);
  margin-top: auto; background: rgba(212, 175, 55, 0.08);
  padding: 5px 16px; border-radius: 20px;
  display: inline-block; align-self: center;
  border: 1px solid rgba(212, 175, 55, 0.22);
  font-family: 'Tajawal', sans-serif;
}
.item-price span { font-size: 0.8em; font-weight: 500; opacity: 0.85; }

/* Sections layout — larger cards */
.menu-sections .item-card .item-img-wrap { aspect-ratio: 16/10; }
.menu-sections .item-card .item-name { font-size: 1.15em; margin-bottom: 14px; }
.menu-sections .item-card .item-price { font-size: 1.15em; padding: 7px 20px; }
.menu-sections .item-card .item-content { padding: 18px; }

/* ============ LIST CARD ============ */
.card-list {
  display: flex; gap: 14px; background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; padding: 10px; align-items: center;
  transition: all 0.3s ease; animation: fadeInUp 0.35s ease both;
}
.card-list:hover { border-color: var(--gold); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.1); }
.card-list-img-wrap {
  width: 76px; height: 76px; border-radius: 10px; overflow: hidden;
  background: var(--bg-3); flex-shrink: 0; position: relative;
}
.card-list-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s; }
.card-list-img.loaded { opacity: 1; }
.card-list .item-info { flex: 1; min-width: 0; }
.card-list .item-name {
  text-align: right; margin-bottom: 6px; font-size: 1em;
  -webkit-line-clamp: 1;
}
.card-list .item-price {
  font-size: 0.95em; padding: 3px 12px; align-self: flex-start;
}

/* ============ EMPTY STATE ============ */
.empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
.empty-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 90px; height: 90px; border-radius: 50%;
  background: var(--card-bg); border: 1px solid var(--border);
  margin-bottom: 20px;
}
.empty-icon .material-symbols-rounded { font-size: 44px; color: var(--gold); opacity: 0.5; }
.empty-state h3 { font-family: 'Amiri', serif; font-size: 1.4em; color: var(--gold); margin-bottom: 8px; }
.empty-state p { font-size: 0.95em; opacity: 0.7; }

/* ============ SKELETON ============ */
.skeleton-card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
.skeleton-img { aspect-ratio: 4/3; background: linear-gradient(90deg, var(--bg-3) 25%, var(--card-bg) 50%, var(--bg-3) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.skeleton-text { height: 14px; margin: 12px 14px; border-radius: 4px; background: linear-gradient(90deg, var(--bg-3) 25%, var(--card-bg) 50%, var(--bg-3) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; width: 70%; }
.skeleton-text.short { width: 40%; margin-bottom: 16px; }

/* ============ BACK TO TOP ============ */
.back-to-top {
  position: fixed; bottom: 22px; left: 22px;
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--gold); color: var(--bg-main); border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 200;
  box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
  opacity: 0; visibility: hidden; transform: translateY(20px);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
.back-to-top:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5); }
.back-to-top .material-symbols-rounded { font-size: 24px; }

/* ============ ANIMATIONS ============ */
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@keyframes rotateSlow { to { transform: rotate(360deg); } }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ RESPONSIVE ============ */
@media (max-width: 400px) {
  .hero h1 { font-size: 2.2em; }
  .hero h2 { font-size: 0.7em; letter-spacing: 6px; }
  .category-title { font-size: 1.7em; }
  .category-icon-big { width: 78px; height: 78px; }
  .category-icon-big .material-symbols-rounded { font-size: 38px; }
}
</style>
</head>
<body>

<header class="hero" id="heroSection">
  <div class="hero-logo" id="logoContainer">الباشا</div>
  <h1 id="restaurantName">بيت الباشا</h1>
  <h2>BEIT AL BASHA</h2>
  <p id="restaurantSubtitle">حيث تلتقي نكهة الضيافة بأجواء الراحة</p>
  <div class="status-badge" id="statusBadge" hidden>
    <span class="status-dot"></span>
    <span id="statusText">مفتوح الآن</span>
  </div>
</header>

<div class="nav-wrapper">
  <nav class="nav-categories" id="nav"></nav>
</div>

<main class="menu-container" id="menu">
  <div class="menu-grid" id="skeletonGrid">
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
  </div>
</main>

<button class="back-to-top" id="backToTop" aria-label="العودة للأعلى">
  <span class="material-symbols-rounded">arrow_upward</span>
</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAE0-gK_eWE5cRxkX-j22zoOYfMSZfNLKk",
    authDomain: "biet-albasha.firebaseapp.com",
    projectId: "biet-albasha",
    storageBucket: "biet-albasha.firebasestorage.app",
    messagingSenderId: "349931331130",
    appId: "1:349931331130:web:1562743baa3f76a9d51f03"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n || 0).toLocaleString('en-US');

  // 🎯 أيقونات Material Symbols احترافية لكل قسم
  const icons = {
    "المشروبات الساخنة": "local_cafe",
    "الأراكيل": "local_fire_department",
    "مشاوي": "kebab_dining",
    "الشاورما": "lunch_dining",
    "السندويش والبرغر": "lunch_dining",
    "الوجبات": "set_meal",
    "بيتزا وفطائر": "local_pizza",
    "مقبلات باردة": "tapas",
    "وجبات ساخنة": "dinner_dining",
    "مقبلات ساخنة": "fastfood",
    "فتات": "ramen_dining",
    "فريتشينو وعصائر": "local_drink",
    "كوكتيلات ومشروبات باردة": "local_bar"
  };
  const defaultIcon = "restaurant";

  let allItems = [];
  let settings = {
    theme: "royal", menuLayout: "grid", logoType: "svg", logoUrl: "",
    categoryOrder: [], showHero: true, name: "بيت الباشا",
    subtitle: "حيث تلتقي نكهة الضيافة بأجواء الراحة", status: ""
  };

  // ============ 1. SETTINGS ============
  onSnapshot(doc(db, "settings", "info"), snap => {
    if (snap.exists()) {
      settings = { ...settings, ...snap.data() };
      if (typeof settings.showHero === "undefined") settings.showHero = true;

      document.documentElement.setAttribute("data-theme", settings.theme || "royal");
      if (settings.name) $("restaurantName").textContent = settings.name;
      if (settings.subtitle) $("restaurantSubtitle").textContent = settings.subtitle;

      // Status badge
      if (settings.status && settings.status.trim()) {
        $("statusText").textContent = settings.status;
        $("statusBadge").hidden = false;
      } else {
        $("statusBadge").hidden = true;
      }

      // Hero show/hide
      const hero = $("heroSection");
      if (settings.showHero === false) hero.classList.add("hidden");
      else hero.classList.remove("hidden");

      // Logo
      const logoBox = $("logoContainer");
      if (settings.logoType === "image" && settings.logoUrl) {
        logoBox.innerHTML = `<img src="${settings.logoUrl}" alt="Logo" onerror="this.parentElement.textContent='الباشا'">`;
      } else {
        logoBox.textContent = "الباشا";
      }
    }
  });

  // ============ 2. MENU ============
  onSnapshot(doc(db, "menu", "all"), snap => {
    if (snap.exists()) allItems = snap.data().items || [];
    else allItems = [];
    renderMenu();
  });

  // ============ 3. RENDER ============
  function renderMenu() {
    const nav = $("nav"), menu = $("menu");
    if (allItems.length === 0) {
      menu.innerHTML = `<div class="empty-state">
        <div class="empty-icon"><span class="material-symbols-rounded">restaurant_menu</span></div>
        <h3>لا توجد أصناف حالياً</h3>
        <p>سيتم إضافة الأصناف قريباً</p>
      </div>`;
      nav.innerHTML = "";
      return;
    }

    // Group by category
    const grouped = {};
    allItems.forEach(item => {
      const cat = item.category || "أخرى";
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(item);
    });

    // Apply category order
    const order = Array.isArray(settings.categoryOrder) ? settings.categoryOrder : [];
    const inOrder = order.filter(c => grouped[c]);
    const notInOrder = Object.keys(grouped)
      .filter(c => !order.includes(c))
      .sort((a, b) => a.localeCompare(b, 'ar'));
    const finalCats = [...inOrder, ...notInOrder];

    nav.innerHTML = "";
    menu.innerHTML = "";

    const layout = settings.menuLayout || "grid";
    const layoutClass = layout === "list" ? "menu-list" : (layout === "sections" ? "menu-sections" : "menu-grid");

    finalCats.forEach((cat, index) => {
      const id = `cat-${index}`;
      const iconName = icons[cat] || defaultIcon;

      // Nav item
      nav.innerHTML += `<a href="#${id}" class="nav-item">
        <span class="material-symbols-rounded">${iconName}</span>
        <span class="nav-label">${cat}</span>
      </a>`;

      // Items HTML based on layout
      let itemsHtml = "";

      if (layout === "list") {
        itemsHtml = `<div class="menu-list">${grouped[cat].map(item => `
          <div class="card-list">
            <div class="card-list-img-wrap">
              ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-list-img" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.style.display='none'">` : ""}
            </div>
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${fmt(item.price)} <span>ل.س</span></div>
            </div>
          </div>
        `).join("")}</div>`;
      } else {
        itemsHtml = `<div class="${layoutClass}">${grouped[cat].map(item => `
          <div class="item-card">
            <div class="item-img-wrap">
              <div class="img-fallback"><span class="material-symbols-rounded">restaurant</span></div>
              ${item.imageUrl ? `<img src="${item.imageUrl}" class="item-img" alt="${item.name}" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.style.display='none'">` : ""}
            </div>
            <div class="item-content">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${fmt(item.price)} <span>ل.س</span></div>
            </div>
          </div>
        `).join("")}</div>`;
      }

      // Category section
      menu.innerHTML += `<section class="category-section" id="${id}">
        <div class="category-header">
          <div class="category-icon-big"><span class="material-symbols-rounded">${iconName}</span></div>
          <h2 class="category-title">${cat}</h2>
          <div class="category-line"><span class="dot"></span></div>
        </div>
        ${itemsHtml}
      </section>`;
    });

    setupScrollSpy();
  }

  // ============ 4. ACTIVE NAV ON SCROLL ============
  function setupScrollSpy() {
    const sections = document.querySelectorAll('.category-section');
    const navItems = document.querySelectorAll('.nav-item');

    const onScroll = () => {
      const navHeight = (document.querySelector('.nav-wrapper')?.offsetHeight || 80) + 40;
      let current = '';
      sections.forEach(section => {
        if (window.scrollY >= section.offsetTop - navHeight) current = section.id;
      });
      navItems.forEach(item => {
        item.classList.toggle('active', item.getAttribute('href') === `#${current}`);
      });
    };
    window.removeEventListener('scroll', onScroll);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // ============ 5. BACK TO TOP ============
  const backToTop = $("backToTop");
  window.addEventListener('scroll', () => {
    backToTop.classList.toggle('show', window.scrollY > 400);
  }, { passive: true });
  backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
