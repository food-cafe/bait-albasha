<style>
:root{--bg:#0A0A0A;--bg2:#141414;--gold:#D4AF37;--text:#FDFBF7;--dim:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(circle at top, #1A1A1A 0%, #0A0A0A 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.card{background:var(--bg2);border-radius:24px;padding:40px 30px;max-width:550px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(212,175,55,0.2);text-align:center;border:1px solid rgba(212,175,55,0.1)}
h1{font-family:'Amiri',serif;font-size:28px;color:var(--gold);margin-bottom:8px}
.sub{font-size:14px;color:var(--dim);margin-bottom:24px}
.warn-box{background:rgba(225,6,0,0.1);border:1.5px solid rgba(225,6,0,0.3);border-radius:12px;padding:14px;margin-bottom:24px;font-size:13px;font-weight:700;color:#FF6B6B}
.btn{width:100%;padding:16px;border-radius:50px;font-family:inherit;font-size:16px;font-weight:900;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),#F3E5AB);color:#0A0A0A;transition:all 0.3s;box-shadow:0 10px 30px rgba(212,175,55,0.3)}
.btn:disabled{opacity:0.5;pointer-events:none}
.progress{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:16px;display:none}
.progress.show{display:block}
.progress-bar{height:100%;width:0%;background:var(--gold);transition:width 0.3s}
.status{margin-top:16px;font-size:14px;font-weight:700;color:var(--dim)}
.status.success{color:#25D366}
.status.error{color:#FF6B6B}
</style>
</head>

    $("status").textContent = "جاري تجهيز الأصناف...";

    try {
      const itemsWithIds = ITEMS.map((item, i) => ({
        id: genId() + i.toString(36),
        category: item.cat, name: item.name, price: item.price, description: "",
        imageUrl: item.img || "", isPopular: false, isOffer: false, offerPrice: 0, prepTime: 0, createdAt: Date.now()
      }));

      $("progressBar").style.width = "60%"; $("status").textContent = "جاري رفع الأصناف إلى Firebase...";
      await setDoc(doc(db, "menu", "all"), { items: itemsWithIds });

      $("progressBar").style.width = "90%"; $("status").textContent = "جاري حفظ الإعدادات...";

      $("progressBar").style.width = "100%"; $("status").textContent = "✅ تم الترحيل بنجاح!";
